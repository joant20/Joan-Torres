<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="cardshadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <clipPath id="scrA"><rect x="597" y="272" width="426" height="666" rx="38"/></clipPath>
    <clipPath id="scrB"><rect x="1095" y="272" width="426" height="666" rx="38"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="#F4F5F7"/>

  <!-- Encabezado -->
  <rect width="1600" height="132" fill="#141416"/>
  <rect x="48" y="43" width="46" height="46" rx="12" fill="#FFD200"/>
  <text x="71" y="74" font-size="19" font-weight="800" fill="#141416" text-anchor="middle">LT</text>
  <text x="112" y="64" font-size="26" font-weight="700" fill="#FFFFFF">LocalTracking</text>
  <text x="112" y="92" font-size="14.5" fill="#9B9BA1">Sistema de pedidos y seguimiento de entregas</text>
  <rect x="1350" y="45" width="202" height="42" rx="21" fill="#FFD200"/>
  <text x="1451" y="72" font-size="16" font-weight="700" fill="#141416" text-anchor="middle">5 · Repartidor</text>

  <text x="48" y="196" font-size="44" font-weight="800" fill="#141416">Mockup · Interfaz del Repartidor</text>
  <text x="48" y="230" font-size="19" fill="#55555C">Interfaz de hardware: uso del GPS para la ubicación y de la cámara como evidencia de entrega</text>

  <text x="810" y="252" font-size="19" font-weight="700" fill="#141416" text-anchor="middle">Ruta con GPS en tiempo real</text>
  <text x="1308" y="252" font-size="19" font-weight="700" fill="#141416" text-anchor="middle">Cámara · evidencia de entrega</text>

  <!-- ============ PANEL INFORMATIVO ============ -->
  <g filter="url(#cardshadow)">
    <rect x="67" y="266" width="470" height="684" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="99" y="298" width="216" height="32" rx="16" fill="#141416"/>
  <text x="207" y="319" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#FFD200" text-anchor="middle">INTERFAZ DE HARDWARE</text>
  <text x="99" y="374" font-size="30" font-weight="800" fill="#141416">Dispositivos físicos</text>
  <text x="99" y="406" font-size="15" fill="#55555C">Cómo el sistema utiliza los dispositivos</text>
  <text x="99" y="430" font-size="15" fill="#55555C">del teléfono para realizar funciones clave.</text>

  <!-- Bloque GPS -->
  <rect x="99" y="460" width="406" height="160" rx="16" fill="#F6F6F8"/>
  <circle cx="145" cy="506" r="26" fill="#0A84FF"/>
  <path d="M145,492 a9,9 0 0 1 9,9 c0,7 -9,16 -9,16 c0,0 -9,-9 -9,-16 a9,9 0 0 1 9,-9 z" fill="#FFFFFF"/>
  <circle cx="145" cy="501" r="3.5" fill="#0A84FF"/>
  <text x="186" y="513" font-size="18" font-weight="800" fill="#141416">GPS del repartidor</text>
  <text x="123" y="554" font-size="14" fill="#55555C">El sistema usa el GPS del teléfono del</text>
  <text x="123" y="578" font-size="14" fill="#55555C">repartidor para mostrar su ubicación</text>
  <text x="123" y="602" font-size="14" fill="#55555C">durante toda la entrega.</text>

  <!-- Bloque Cámara -->
  <rect x="99" y="640" width="406" height="140" rx="16" fill="#F6F6F8"/>
  <circle cx="145" cy="686" r="26" fill="#FFD200"/>
  <rect x="132" y="679" width="26" height="19" rx="4" fill="#141416"/>
  <rect x="139" y="675" width="12" height="6" rx="2" fill="#141416"/>
  <circle cx="145" cy="688" r="6" fill="#FFD200"/>
  <text x="186" y="693" font-size="18" font-weight="800" fill="#141416">Cámara · evidencia</text>
  <text x="123" y="734" font-size="14" fill="#55555C">Se toman fotografías al entregar el</text>
  <text x="123" y="758" font-size="14" fill="#55555C">pedido como constancia de la entrega.</text>

  <!-- Nota -->
  <rect x="99" y="800" width="406" height="118" rx="16" fill="#FFF8D6"/>
  <text x="123" y="836" font-size="14.5" fill="#6B5B10">Estas funciones forman parte del</text>
  <text x="123" y="860" font-size="14.5" fill="#6B5B10">funcionamiento previsto del sistema y</text>
  <text x="123" y="884" font-size="14.5" fill="#6B5B10">deberán implementarse durante la</text>
  <text x="123" y="908" font-size="14.5" fill="#6B5B10">construcción de LocalTracking.</text>

  <!-- ============ PANTALLA A: RUTA GPS ============ -->
  <g filter="url(#shadow)">
    <rect x="585" y="266" width="450" height="684" rx="48" fill="#1B1B1D"/>
  </g>
  <rect x="597" y="272" width="426" height="666" rx="38" fill="#16161A"/>
  <g clip-path="url(#scrA)">
    <!-- Mapa -->
    <rect x="597" y="272" width="426" height="666" fill="#16161A"/>
    <g stroke="#24242A" stroke-width="15">
      <line x1="597" y1="370" x2="1023" y2="370"/>
      <line x1="597" y1="470" x2="1023" y2="470"/>
      <line x1="597" y1="570" x2="1023" y2="570"/>
      <line x1="597" y1="670" x2="1023" y2="670"/>
      <line x1="597" y1="770" x2="1023" y2="770"/>
      <line x1="670" y1="272" x2="670" y2="938"/>
      <line x1="760" y1="272" x2="760" y2="938"/>
      <line x1="850" y1="272" x2="850" y2="938"/>
      <line x1="940" y1="272" x2="940" y2="938"/>
    </g>
    <polyline points="660,560 715,615 790,650 875,565 960,470" fill="none" stroke="#FFD200" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pin comercio -->
    <g transform="translate(660,560)">
      <circle r="26" fill="#FFFFFF" stroke="#141416" stroke-width="3"/>
      <path d="M-12,-4 L0,-14 L12,-4 Z" fill="#141416"/>
      <rect x="-9" y="-4" width="18" height="14" fill="#141416"/>
      <rect x="-4" y="1" width="8" height="9" fill="#FFD200"/>
    </g>
    <!-- Pin destino -->
    <g transform="translate(960,470)">
      <circle r="26" fill="#FFFFFF" stroke="#141416" stroke-width="3"/>
      <path d="M-11,0 L0,-10 L11,0 M-8,-2 V10 H8 V-2" fill="none" stroke="#141416" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <!-- Ubicación actual del repartidor -->
    <circle cx="790" cy="650" r="30" fill="#0A84FF" opacity="0.22"/>
    <circle cx="790" cy="650" r="14" fill="#0A84FF" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Tarjeta superior -->
    <rect x="621" y="300" width="378" height="104" rx="18" fill="#1F1F23"/>
    <text x="645" y="332" font-size="13" font-weight="700" fill="#FFD200">PEDIDO OCT. #1</text>
    <text x="645" y="362" font-size="17.5" font-weight="800" fill="#FFFFFF">Recoger en La Pizzería Central</text>
    <text x="645" y="388" font-size="14" fill="#9B9BA1">1.2 km · 8 min · 2 productos</text>

    <!-- Pill GPS -->
    <rect x="621" y="420" width="140" height="36" rx="18" fill="#1F1F23"/>
    <circle cx="643" cy="438" r="6" fill="#34C759"/>
    <text x="657" y="443" font-size="13.5" font-weight="700" fill="#FFFFFF">GPS activo</text>

    <!-- Hoja inferior -->
    <rect x="597" y="690" width="426" height="260" fill="#1F1F23"/>
    <rect x="780" y="704" width="60" height="5" rx="2.5" fill="#4A4A50"/>
    <text x="621" y="742" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9B9BA1">DESTINO</text>
    <text x="621" y="770" font-size="17.5" font-weight="800" fill="#FFFFFF">Av. Principal 123, Centro</text>

    <circle cx="641" cy="808" r="20" fill="#3A3A42"/>
    <text x="641" y="814" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">MR</text>
    <text x="672" y="804" font-size="15" font-weight="700" fill="#FFFFFF">María R.</text>
    <text x="672" y="824" font-size="12.5" fill="#9B9BA1">Cliente · 2do piso</text>

    <rect x="621" y="850" width="378" height="58" rx="16" fill="#FFD200"/>
    <text x="810" y="887" font-size="17.5" font-weight="800" fill="#141416" text-anchor="middle">He llegado al comercio</text>
  </g>

  <!-- ============ PANTALLA B: CÁMARA EVIDENCIA ============ -->
  <g filter="url(#shadow)">
    <rect x="1083" y="266" width="450" height="684" rx="48" fill="#1B1B1D"/>
  </g>
  <rect x="1095" y="272" width="426" height="666" rx="38" fill="#0E0E10"/>
  <g clip-path="url(#scrB)">
    <rect x="1095" y="272" width="426" height="666" fill="#0E0E10"/>

    <!-- Barra superior -->
    <path d="M1135,312 l-12,10 l12,10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1308" y="326" font-size="16.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Evidencia de entrega</text>
    <path d="M1486,306 l10,14 h-6 l4,10 l-12,-14 h6 z" fill="#FFD200"/>

    <!-- Visor de la cámara -->
    <rect x="1115" y="348" width="386" height="430" rx="20" fill="#C4BDB2"/>
    <g clip-path="url(#scrB)">
      <rect x="1115" y="348" width="386" height="430" fill="#C4BDB2"/>
      <rect x="1115" y="660" width="386" height="118" fill="#97908A"/>
      <rect x="1290" y="398" width="150" height="262" fill="#7A5236" stroke="#5E3E28" stroke-width="5"/>
      <circle cx="1312" cy="534" r="7" fill="#E0C089"/>
      <rect x="1150" y="596" width="118" height="64" rx="6" fill="#CFA063"/>
      <rect x="1202" y="596" width="14" height="64" fill="#E8C896"/>
      <line x1="1150" y1="624" x2="1268" y2="624" stroke="#B78A4B" stroke-width="3"/>
      <rect x="1276" y="620" width="70" height="40" rx="5" fill="#CFA063"/>
      <rect x="1306" y="620" width="10" height="40" fill="#E8C896"/>
    </g>

    <!-- Esquinas de encuadre -->
    <g stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M1139,414 v-30 h34"/>
      <path d="M1477,414 v-30 h-34"/>
      <path d="M1139,712 v30 h34"/>
      <path d="M1477,712 v30 h-34"/>
    </g>

    <rect x="1212" y="716" width="192" height="38" rx="19" fill="#000000CC"/>
    <text x="1308" y="741" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Toma foto de la evidencia</text>

    <!-- Controles -->
    <rect x="1147" y="812" width="58" height="58" rx="14" fill="#3A3A42"/>
    <rect x="1160" y="826" width="32" height="24" rx="4" fill="#8E8E93"/>
    <path d="M1164,846 l8,-9 l7,8 l6,-6 l7,7" fill="none" stroke="#3A3A42" stroke-width="3"/>

    <circle cx="1308" cy="841" r="38" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="1308" cy="841" r="27" fill="#FFFFFF"/>

    <circle cx="1469" cy="841" r="28" fill="#3A3A42"/>
    <path d="M1457,846 a12,12 0 0 1 20,-12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M1478,830 l2,7 l-7,1 z" fill="#FFFFFF"/>
    <path d="M1481,836 a12,12 0 0 1 -20,12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M1460,852 l-2,-7 l7,-1 z" fill="#FFFFFF"/>

    <text x="1308" y="916" font-size="13" fill="#9A9AA0" text-anchor="middle">La foto se adjunta al pedido como prueba de entrega</text>
  </g>

  <text x="800" y="982" font-size="13" fill="#9B9BA1" text-anchor="middle">Proyecto LocalTracking · Imagen 5 de 5 · Interfaz de hardware (repartidor)</text>
</svg>
